version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - 6379:6379

  mongo:
    image: mongo
    ports:
      - 27017:27017
    environment:
      - MONGO_INITDB_DATABASE=novu-db

  api:
    image: ghcr.io/novuhq/novu/api:latest
    depends_on:
      - redis
      - mongo
    environment:
      - NODE_ENV=production
      - MONGO_URL=mongodb://mongo:27017/novu-db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - FRONT_BASE_URL=${FRONT_BASE_URL}
      - NOVU_ENTERPRISE=${VITE_NOVU_ENTERPRISE}
      - EE_AUTH_PROVIDER=${VITE_EE_AUTH_PROVIDER}
      - JWT_SECRET=${JWT_SECRET}
      - STORE_ENCRYPTION_KEY=${STORE_ENCRYPTION_KEY}
      - STRIPE_API_KEY=${STRIPE_API_KEY}
    ports:
      - 3000:3000

  worker:
    image: ghcr.io/novuhq/novu/worker:latest
    depends_on:
      - redis
      - mongo
    environment:
      - NODE_ENV=production
      - MONGO_URL=mongodb://mongo:27017/novu-db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - STORE_ENCRYPTION_KEY=${STORE_ENCRYPTION_KEY}
      - NOVU_ENTERPRISE=${VITE_NOVU_ENTERPRISE}
    ports:
      - 3004:3004

  ws:
    image: ghcr.io/novuhq/novu/ws:latest
    depends_on:
      - redis
      - mongo
    environment:
      - NODE_ENV=production
      - MONGO_URL=mongodb://mongo:27017/novu-db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
    ports:
      - 3002:3002

  web:
    image: ghcr.io/novuhq/novu/web:latest
    environment:
      - NODE_ENV=production
      - VITE_NOVU_ENTERPRISE=${VITE_NOVU_ENTERPRISE}
      - VITE_EE_AUTH_PROVIDER=${VITE_EE_AUTH_PROVIDER}
      - VITE_API_URL=${API_ROOT_URL}
      - VITE_WS_URL=${WEBHOOK_URL}
    ports:
      - 4200:4200
